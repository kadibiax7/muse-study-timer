<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muse Study Timer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    -webkit-app-region: drag;
  }
  /* gentle idle bob */
  #bob { width: 100%; height: 100%; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  /* look left / right + jump live on the character */
  #jolly-wrap {
    width: 100%; height: 100%;
    transition: transform 0.6s ease-in-out;
    transform-origin: 50% 85%;
  }
  #jolly-wrap.look-left  { transform: rotate(-5deg) translateX(-7px); }
  #jolly-wrap.look-right { transform: rotate(5deg) translateX(7px); }
  #jolly-wrap.jumping { animation: jump 0.8s ease-in-out; }
  @keyframes jump {
    0%   { transform: translateY(0) scale(1, 1); }
    35%  { transform: translateY(-30px) scale(0.98, 1.03); }
    60%  { transform: translateY(0) scale(1.03, 0.95); }
    80%  { transform: translateY(-6px) scale(1, 1); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  #jolly {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  /* waving hand by Jolly's left arm */
  #wave-hand {
    position: absolute;
    left: 76%; top: 56%;
    font-size: 9vw;
    opacity: 0;
    pointer-events: none;
    transform-origin: 20% 80%;
  }
  #wave-hand.waving { animation: wave 2.2s ease-in-out; }
  @keyframes wave {
    0% { opacity: 0; transform: rotate(0deg) translateY(6px); }
    12% { opacity: 1; transform: rotate(-18deg) translateY(0); }
    28% { transform: rotate(16deg); }
    44% { transform: rotate(-18deg); }
    60% { transform: rotate(16deg); }
    76% { transform: rotate(-10deg); }
    88% { opacity: 1; }
    100% { opacity: 0; transform: rotate(0deg) translateY(6px); }
  }
  /* date, small, above the face */
  #date {
    position: absolute;
    top: 1.5%; left: 50%;
    transform: translateX(-50%);
    font-size: 3.6vw;
    color: #374151;
    background: rgba(255,255,255,0.65);
    padding: 1px 8px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
  }
  /* the countdown, on Jolly's chest */
  #time {
    position: absolute;
    top: 60%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13vw;
    font-weight: 800;
    color: #1f2937;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 3px rgba(255,255,255,0.9);
    pointer-events: none;
    white-space: nowrap;
  }
  #time.done { color: #047857; }
  /* controls, small pills at the bottom */
  #controls {
    position: absolute;
    bottom: 2.5%; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    -webkit-app-region: no-drag;
    width: 96%;
  }
  .row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  button {
    background: rgba(17, 24, 39, 0.78); color: #f9fafb;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px; padding: 3px 9px; font-size: 11px; cursor: pointer;
  }
  button:hover { background: rgba(55, 65, 81, 0.9); }
  button.active { background: #2563eb; border-color: #2563eb; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.primary:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div id="stage" title="Drag me around — click me and I'll jump!">
    <div id="bob">
      <div id="jolly-wrap">
        <img id="jolly" src="jolly.png" alt="Muse the study buddy">
      </div>
    </div>
    <div id="wave-hand">👋</div>
    <div id="date"></div>
    <div id="time">60:00</div>
    <div id="controls">
      <div class="row" id="presets">
        <button data-min="15">15</button>
        <button data-min="25">25</button>
        <button data-min="45">45</button>
        <button data-min="60" class="active">60</button>
      </div>
      <div class="row">
        <button id="startPause" class="primary">Start</button>
        <button id="reset">Reset</button>
      </div>
    </div>
  </div>
<script>
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const startPauseBtn = document.getElementById('startPause');
  const resetBtn = document.getElementById('reset');
  const presetBtns = document.querySelectorAll('#presets button');
  const jollyWrap = document.getElementById('jolly-wrap');
  const waveHand = document.getElementById('wave-hand');
  const stage = document.getElementById('stage');

  function renderDate() {
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric'
    });
  }
  renderDate();
  setInterval(renderDate, 30000);

  let totalSeconds = 60 * 60;
  let remaining = totalSeconds;
  let timerId = null;
  let running = false;

  function fmt(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }
  function draw() {
    timeEl.textContent = fmt(remaining);
    timeEl.classList.toggle('done', remaining === 0);
  }
  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 400, 800].forEach((delay) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.start(ctx.currentTime + delay / 1000);
        osc.stop(ctx.currentTime + delay / 1000 + 0.35);
      });
    } catch (e) { /* audio unavailable */ }
  }
  function tick() {
    if (remaining > 0) {
      remaining--;
      draw();
      if (remaining === 0) {
        clearInterval(timerId);
        timerId = null;
        running = false;
        startPauseBtn.textContent = 'Start';
        chime();
        doJump();
      }
    }
  }
  startPauseBtn.addEventListener('click', () => {
    if (running) {
      clearInterval(timerId);
      timerId = null;
      running = false;
      startPauseBtn.textContent = 'Resume';
    } else {
      if (remaining === 0) remaining = totalSeconds;
      timerId = setInterval(tick, 1000);
      running = true;
      startPauseBtn.textContent = 'Pause';
    }
  });
  resetBtn.addEventListener('click', () => {
    clearInterval(timerId);
    timerId = null;
    running = false;
    remaining = totalSeconds;
    startPauseBtn.textContent = 'Start';
    draw();
  });
  presetBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      presetBtns.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      totalSeconds = parseInt(btn.dataset.min, 10) * 60;
      clearInterval(timerId);
      timerId = null;
      running = false;
      remaining = totalSeconds;
      startPauseBtn.textContent = 'Start';
      draw();
    });
  });

  /* ---- Jolly comes alive ---- */
  function doJump() {
    jollyWrap.classList.remove('jumping');
    void jollyWrap.offsetWidth; /* restart the animation */
    jollyWrap.classList.add('jumping');
    setTimeout(() => jollyWrap.classList.remove('jumping'), 850);
  }
  function doWave() {
    waveHand.classList.remove('waving');
    void waveHand.offsetWidth;
    waveHand.classList.add('waving');
    setTimeout(() => waveHand.classList.remove('waving'), 2300);
  }
  function lookAround() {
    const pick = Math.random();
    jollyWrap.classList.remove('look-left', 'look-right');
    if (pick < 0.35) jollyWrap.classList.add('look-left');
    else if (pick < 0.7) jollyWrap.classList.add('look-right');
    setTimeout(() => jollyWrap.classList.remove('look-left', 'look-right'), 1400);
  }
  function scheduleLook() {
    setTimeout(() => { lookAround(); scheduleLook(); }, 4000 + Math.random() * 5000);
  }
  function scheduleJump() {
    setTimeout(() => { doJump(); scheduleJump(); }, 25000 + Math.random() * 15000);
  }
  function scheduleWave() {
    setTimeout(() => { doWave(); scheduleWave(); }, 20000 + Math.random() * 12000);
  }
  stage.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    doJump();
    if (Math.random() < 0.5) doWave();
  });
  scheduleLook();
  scheduleJump();
  scheduleWave();
  setTimeout(doWave, 2500); /* a hello when it opens */
  draw();
</script>
</body>
</html>
